name: "CI"
on: [push, pull_request]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ansifilter bats shellcheck

      - name: "Run ShellCheck"
        run: find . -type f -executable -not -path './.git/*' | xargs shellcheck

      - name: "Run Bats tests"
        run: bats test/ppb.bats
